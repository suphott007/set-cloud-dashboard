name: SET intraday pilot
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Script itself enforces Bangkok market windows.
    - cron: '*/5 3-5,7-9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: set-intraday-pilot
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/update_live.py --force
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update SET pilot snapshot"
          git push
