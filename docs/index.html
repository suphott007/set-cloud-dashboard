<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SET Cloud 4-Chart</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>
:root{--bg:#0f1116;--panel:#131722;--grid:#242733;--text:#d1d4dc;--muted:#787b86;--border:#2a2e39}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}.top{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#11141b;border-bottom:1px solid var(--border);font-size:13px}.brand{font-weight:700}.cloud{color:#80cbc4}.hint{color:var(--muted)}.grid{height:calc(100vh - 40px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--border)}.panel{min-width:0;min-height:0;background:var(--panel);display:grid;grid-template-rows:34px 1fr 22%}.head{display:flex;align-items:center;gap:6px;padding:3px 7px;border-bottom:1px solid #20232d}.symbol{width:100px;background:#1b1f2a;color:#fff;border:1px solid #363a45;border-radius:4px;padding:4px 6px;font-weight:700;text-transform:uppercase}.quote{font-size:12px;min-width:110px}.up{color:#26a69a}.down{color:#ef5350}.tf button{background:transparent;color:#aeb1bb;border:0;border-radius:4px;padding:4px 6px}.tf button.active{background:#26334f;color:#fff}.spacer{flex:1}.stamp{font-size:9px;color:#80cbc4}.chartwrap,.rsiwrap{position:relative;min-height:0}.chart,.rsi{height:100%;width:100%}.rsiwrap{border-top:1px solid #20232d}.legend,.ohlc,.rsilabel{position:absolute;z-index:4;left:7px;font-size:10px;background:rgba(19,23,34,.6);padding:2px 4px;pointer-events:none}.legend{top:3px}.ohlc{top:20px;color:#aeb1bb}.rsilabel{top:3px;color:#9aa0aa}.err{position:absolute;z-index:9;padding:8px;color:#ffcc80;font-size:12px}.ema{margin-right:6px}@media(max-width:800px) and (orientation:portrait){body{overflow:auto}.grid{grid-template-columns:1fr;grid-template-rows:repeat(4,50vh);height:auto}.panel{min-height:420px}}
</style></head><body><div class="top"><span class="brand">SET • 4 CHART</span><span class="cloud">CLOUD</span><span class="hint">D / W / M • EMA 20/50/75/89/200 • RSI(14) • Auto-refresh 60s</span><span id="autostatus" class="stamp" style="margin-left:auto">AUTO 60s</span></div><div class="grid" id="grid"></div><datalist id="symbols"></datalist><script>
const EMA=[['ema20','#2962ff'],['ema50','#ff9800'],['ema75','#9c27b0'],['ema89','#00bcd4'],['ema200','#e91e63']]; const defaults=['IRPC','PTT','SCB','CPF'];let symbols=[];
function opts(el){return{width:el.clientWidth,height:el.clientHeight,layout:{background:{type:'solid',color:'#131722'},textColor:'#b2b5be',fontSize:10},grid:{vertLines:{color:'#1f2330'},horzLines:{color:'#1f2330'}},rightPriceScale:{borderColor:'#2a2e39'},timeScale:{borderColor:'#2a2e39',rightOffset:5},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true}}}
function add(c,t,o){if(c.addSeries){let C=t==='c'?LightweightCharts.CandlestickSeries:t==='h'?LightweightCharts.HistogramSeries:LightweightCharts.LineSeries;return c.addSeries(C,o)}return t==='c'?c.addCandlestickSeries(o):t==='h'?c.addHistogramSeries(o):c.addLineSeries(o)}
function agg(rows,tf){if(tf==='D')return rows; const m=new Map(); for(const r of rows){let d=new Date(r.time+'T12:00:00'); let key;if(tf==='W'){let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+4);key=d.toISOString().slice(0,10)}else key=r.time.slice(0,7)+'-01';let a=m.get(key);if(!a)a={time:key,open:r.open,high:r.high,low:r.low,close:r.close,volume:r.volume||0};else{a.high=Math.max(a.high,r.high);a.low=Math.min(a.low,r.low);a.close=r.close;a.volume+=(r.volume||0)}m.set(key,a)}return [...m.values()].sort((a,b)=>a.time.localeCompare(b.time))}
function ema(rows,n){let k=2/(n+1),v=null;return rows.map(r=>{v=v===null?r.close:r.close*k+v*(1-k);return{time:r.time,value:v}})}function rsi(rows,n=14){let out=[],g=0,l=0,ag=null,al=null;for(let i=0;i<rows.length;i++){if(i===0){out.push({time:rows[i].time,value:50});continue}let d=rows[i].close-rows[i-1].close,gg=Math.max(d,0),ll=Math.max(-d,0);if(i<=n){g+=gg;l+=ll;if(i===n){ag=g/n;al=l/n}}else{ag=(ag*(n-1)+gg)/n;al=(al*(n-1)+ll)/n}let v=(ag===null)?50:(al===0?100:100-100/(1+ag/al));out.push({time:rows[i].time,value:v})}return out}
async function getJSON(u){let r=await fetch(u+'?v='+Date.now());if(!r.ok)throw new Error(r.status+' '+u);return r.json()}
class Panel{constructor(i,s){this.i=i;this.sym=s;this.tf='D';this.el=document.createElement('section');this.el.className='panel';this.el.innerHTML=`<div class="head"><input class="symbol" list="symbols" value="${s}"><span class="quote">—</span><div class="tf"><button class="active" data-tf="D">D</button><button data-tf="W">W</button><button data-tf="M">M</button></div><span class="spacer"></span><span class="stamp"></span></div><div class="chartwrap"><div class="legend"></div><div class="ohlc"></div><div class="chart"></div></div><div class="rsiwrap"><span class="rsilabel">RSI 14</span><div class="rsi"></div></div>`;grid.appendChild(this.el);this.q=this.el.querySelector('.quote');this.stamp=this.el.querySelector('.stamp');this.ohlc=this.el.querySelector('.ohlc');this.el.querySelector('.legend').innerHTML=EMA.map(x=>`<span class="ema" style="color:${x[1]}">${x[0].toUpperCase()}</span>`).join('');this.make();this.bind();this.load()}
make(){let ce=this.el.querySelector('.chart'),re=this.el.querySelector('.rsi');this.c=LightweightCharts.createChart(ce,opts(ce));this.k=add(this.c,'c',{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});this.v=add(this.c,'h',{priceFormat:{type:'volume'},priceScaleId:'vol'});this.c.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});this.e={};EMA.forEach(([k,col])=>this.e[k]=add(this.c,'l',{color:col,lineWidth:1.2,priceLineVisible:false,lastValueVisible:false}));this.rc=LightweightCharts.createChart(re,{...opts(re),timeScale:{visible:false}});this.r=add(this.rc,'l',{color:'#b388ff',lineWidth:1.2,priceLineVisible:false});let lock=false;const sy=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(x=>{if(!x||lock)return;lock=true;try{b.timeScale().setVisibleLogicalRange(x)}finally{lock=false}});sy(this.c,this.rc);sy(this.rc,this.c);this.c.subscribeCrosshairMove(p=>{let b=p?.seriesData?.get(this.k),v=p?.seriesData?.get(this.v);if(b)this.ohlc.textContent=`${p.time} O ${b.open.toFixed(2)} H ${b.high.toFixed(2)} L ${b.low.toFixed(2)} C ${b.close.toFixed(2)} V ${Math.round(v?.value||0).toLocaleString()}`});new ResizeObserver(()=>{this.c.resize(ce.clientWidth,ce.clientHeight);this.rc.resize(re.clientWidth,re.clientHeight)}).observe(this.el)}
bind(){let inp=this.el.querySelector('.symbol');const go=()=>{this.sym=inp.value.trim().toUpperCase();this.load()};inp.onchange=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();inp.blur()}};this.el.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{this.tf=b.dataset.tf;this.el.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x===b));this.load()})}
render(live={},fit=false){let rows=[...(this.history||[])];let q=live.quotes?.[this.sym];if(q){let lr={time:q.Date,open:q.Open,high:q.High,low:q.Low,close:q.Close,volume:q.Volume};rows=rows.filter(x=>x.time!==lr.time).concat([lr]).sort((a,b)=>a.time.localeCompare(b.time));this.stamp.textContent=`${q.source} ${q.fetchedAt?.slice(11,16)||''}`}else this.stamp.textContent='EOD';rows=agg(rows,this.tf);if(!rows.length)throw new Error('NO DATA');this.k.setData(rows.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));this.v.setData(rows.map(x=>({time:x.time,value:x.volume||0,color:x.close>=x.open?'#26a69a':'#ef5350'})));[20,50,75,89,200].forEach(n=>this.e['ema'+n].setData(ema(rows,n)));this.r.setData(rsi(rows));let z=rows.at(-1),p=rows.at(-2)||z,chg=(z.close/p.close-1)*100;this.q.textContent=`${z.close.toLocaleString()} ${chg>=0?'+':''}${chg.toFixed(2)}%`;this.q.className='quote '+(chg>=0?'up':'down');this.ohlc.textContent=`${z.time} O ${z.open.toFixed(2)} H ${z.high.toFixed(2)} L ${z.low.toFixed(2)} C ${z.close.toFixed(2)} V ${Math.round(z.volume||0).toLocaleString()}`;if(fit){this.c.timeScale().fitContent();this.rc.timeScale().fitContent()}}
async load(){try{let h=await getJSON(`data/history/${this.sym}.json`);this.history=h.rows||[];let live={};try{live=await getJSON('data/live.json')}catch{}this.render(live,true)}catch(e){this.q.textContent='NO DATA';this.stamp.textContent=e.message}}
applyLive(live){try{this.render(live,false)}catch(e){this.stamp.textContent=e.message}}
}
(async()=>{try{let s=await getJSON('data/symbols.json');symbols=s.symbols||[]}catch{}document.querySelector('#symbols').innerHTML=symbols.map(x=>`<option value="${x}">`).join('');let saved=JSON.parse(localStorage.getItem('cloud4')||'null')||defaults;let ps=saved.map((s,i)=>new Panel(i,s));window.addEventListener('beforeunload',()=>localStorage.setItem('cloud4',JSON.stringify(ps.map(x=>x.sym))));let lastUpdated='';async function pollLive(){let st=document.getElementById('autostatus');try{let live=await getJSON('data/live.json');let u=live.updatedAt||'';if(u&&u!==lastUpdated){ps.forEach(p=>p.applyLive(live));lastUpdated=u;st.textContent=`AUTO • ${u.slice(11,16)||'updated'}`}else{st.textContent=`AUTO 60s • ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}`}}catch(e){st.textContent='AUTO • OFFLINE'}}setTimeout(pollLive,5000);setInterval(pollLive,60000)})();
</script></body></html>
